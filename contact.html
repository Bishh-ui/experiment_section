<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | ASWATHAMA</title>

   
    <link rel="stylesheet" href="css/style.css">

    
    <link rel="stylesheet" href="css/contact.css">

   
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>

<header class="navbar">
    <div class="logo">ASWATHAMA</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="collection.html">Collection</a>
        <a href="men.html">Men</a>
        <a href="women.html">Women</a>
        <a href="contact.html">Contact</a>
        <a href="feedback.html">Feedback</a>
    </nav>
</header>

<main class="contact-section">
    <h2>Let’s Talk</h2>
    <p class="contact-subtitle">
        Have a question or want to collaborate?  
        Our team will get back to you shortly.
    </p>

    <form class="contact-form">
        <div class="form-group">
            <input type="text" placeholder="Full Name" required>
        </div>

        <div class="form-group">
            <input type="email" placeholder="Email Address" required>
        </div>

        <div class="form-group">
            <textarea rows="5" placeholder="Your Message" required></textarea>
        </div>

        <button type="submit" class="cta">Send Message</button>
    </form>
</main>

<section class="products">
    <h2>Featured Products</h2>
    <div class="filter-bar">
        <input type="search" placeholder="Search products..." />
        <div class="categories">
            <button class="cat-btn active" data-cat="all">All</button>
            <button class="cat-btn" data-cat="Hoodies">Hoodies</button>
        </div>
        <select>
            <option value="default">Sort: Featured</option>
            <option value="price-asc">Price: Low → High</option>
            <option value="price-desc">Price: High → Low</option>
        </select>
    </div>

    <div class="product-grid">
        <div class="card product-item" data-category="Hoodies" data-price="49" data-name="Urban Hoodie">
            <div class="card-img"><img src="image/hoodie.png" alt="Urban Hoodie" loading="lazy"></div>
            <h3>Urban Hoodie</h3>
            <p>$49</p>
        </div>
    </div>
</section>

<footer>
    <p>© 2026 ASWATHAMA. All Rights Reserved.</p>
</footer>

<script src="js/site.js"></script>

</body>
</html>
