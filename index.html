<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ASWATHAMA | Premium Fashion</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/contact.css" />
    <link rel="stylesheet" href="css/collection.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>

<header class="navbar">
    <div class="logo">ASWATHAMA</div>
    <nav>
    <a href="home.html">Home</a>
    <a href="collection.html">Collection</a>
    <a href="men.html">Men</a>
    <a href="#women.html">Women</a>
    <a href="contact.html">Contact</a>
    <a href="feedback.html">Feedback</a>
</nav>

</header>

<section class="hero">
    <div class="hero-content">
        <h1>Define Your<br><span>Style</span></h1>
        <p>Luxury fashion crafted for modern Genzii.</p>
        <button class="cta">Explore Collection</button>
    </div>

    <div class="hero-image">
        <img src="image/hoodie.png" alt="Premium Hoodie">
    </div>


</section>

<section class="products">
    <h2>Featured Collection</h2>
    <div class="filter-bar">
        <input type="search" placeholder="Search products, e.g. 'jacket'" />
        <div class="categories">
            <button class="cat-btn active" data-cat="all">All</button>
            <button class="cat-btn" data-cat="Jackets">Jackets</button>
            <button class="cat-btn" data-cat="Shirts">Shirts</button>
            <button class="cat-btn" data-cat="Hoodies">Hoodies</button>
        </div>
        <select>
            <option value="default">Sort: Featured</option>
            <option value="price-asc">Price: Low → High</option>
            <option value="price-desc">Price: High → Low</option>
        </select>
    </div>

    <div class="product-grid">
        <div class="card product-item" data-category="Jackets" data-price="4999" data-name="Classic Black Jacket">
            <div class="card-img">
                <img src="image/black_jacket.png" alt="Classic Black Jacket" loading="lazy">
            </div>
            <h3>Classic Black Jacket</h3>
            <p>₹4,999</p>
        </div>

        <div class="card product-item" data-category="Shirts" data-price="2499" data-name="Premium White Shirt">
            <div class="card-img">
                <img src="image/white_shirt.png" alt="Premium White Shirt" loading="lazy">
            </div>
            <h3>Premium White Shirt</h3>
            <p>₹2,499</p>
        </div>

        <div class="card product-item" data-category="Hoodies" data-price="3299" data-name="Urban Street Hoodie">
            <div class="card-img">
                <img src="image/hoodie.png" alt="Urban Street Hoodie" loading="lazy">
            </div>
            <h3>Urban Street Hoodie</h3>
            <p>₹3,299</p>
        </div>
    </div>
</section>

<footer>
    <p>© 2026 LUXE. All Rights Reserved.</p>
</footer>

<script src="js/site.js"></script>

</body>
</html>
